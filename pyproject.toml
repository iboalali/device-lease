[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devicelease"
version = "0.1.0"
description = "Shared Android device claims for agent sessions"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
devicelease = "devicelease.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
